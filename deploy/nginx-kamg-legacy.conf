# Ancien nom https://kamg.sterennfonseca.fr — redirige vers https://kamg.fr
# SAUF le flux ICS : Google Agenda refuse d’ajouter un agenda si l’URL renvoie un 301 HTML.
#
# Copier vers /etc/nginx/sites-available/kamg.sterennfonseca.fr
# Ne pas écraser les blocs ssl_certificate ajoutés par Certbot.

server {
    server_name kamg.sterennfonseca.fr;
    client_max_body_size 20m;

    location = /calendrier.ics {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /calendar.ics {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/public/calendar.ics {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://kamg.fr$request_uri;
    }
}
