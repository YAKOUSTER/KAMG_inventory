# Virtual host kamg.fr — ne pas modifier le serveur AppMEUR (sterennfonseca.fr).
# Copier vers /etc/nginx/sites-available/kamg.fr
# puis : ln -s /etc/nginx/sites-available/kamg.fr /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#        certbot --nginx -d kamg.fr -d www.kamg.fr
#
# Retirer KAMG de sterennfonseca.fr :
#   1. DNS de sterennfonseca.fr : supprimer l’enregistrement A (et AAAA) du sous-domaine « kamg ».
#   2. Nginx : désactiver l’ancien site kamg.sterennfonseca.fr (ou le laisser en redirection ci-dessous).
#   3. Ne pas toucher au vhost sterennfonseca.fr (AppMEUR).

server {
    listen 80;
    listen [::]:80;
    server_name kamg.fr www.kamg.fr;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Ancien sous-domaine : redirige vers kamg.fr. À supprimer après le DNS.
server {
    listen 80;
    listen [::]:80;
    server_name kamg.sterennfonseca.fr;
    return 301 https://kamg.fr$request_uri;
}
