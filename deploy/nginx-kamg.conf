# Nouveau virtual host — ne pas modifier le serveur AppMEUR (sterennfonseca.fr).
# Copier vers /etc/nginx/sites-available/kamg.sterennfonseca.fr
# puis : ln -s /etc/nginx/sites-available/kamg.sterennfonseca.fr /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#        certbot --nginx -d kamg.sterennfonseca.fr

server {
    listen 80;
    listen [::]:80;
    server_name kamg.sterennfonseca.fr;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
